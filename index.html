<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminbuch Fahrschule Popel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14213d;--mute:#5b6779;--line:#d5dde7;--acc:#0b5cad;--acc-ink:#fff;--ok:#1f8a4c;--okbg:#e2f4e9;--wait:#b86200;--waitbg:#fff0d9;--bad:#c62f2f;--badbg:#fde3e3;--done:#5b4bb5;--donebg:#ebe7fb;--new:#5b6779;--newbg:#e8edf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--card:#182233;--ink:#e8eef7;--mute:#9aa8bc;--line:#2b3a52;--acc:#5aa6f0;--acc-ink:#0a1422;--ok:#5fd18b;--okbg:#17382a;--wait:#f0b45a;--waitbg:#3b2d12;--bad:#ff8585;--badbg:#431c1c;--done:#b3a6ff;--donebg:#2a2650;--new:#9aa8bc;--newbg:#223048}}
:root[data-theme="dark"]{--bg:#0f1622;--card:#182233;--ink:#e8eef7;--mute:#9aa8bc;--line:#2b3a52;--acc:#5aa6f0;--acc-ink:#0a1422;--ok:#5fd18b;--okbg:#17382a;--wait:#f0b45a;--waitbg:#3b2d12;--bad:#ff8585;--badbg:#431c1c;--done:#b3a6ff;--donebg:#2a2650;--new:#9aa8bc;--newbg:#223048}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header{padding:18px 16px 8px}
h1{margin:0;font-size:24px}
.sub{color:var(--mute);font-size:15px;margin-top:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mute);font:inherit;font-weight:700}
.tabs button.on{color:var(--acc)}
.days{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
.days button{flex:1;min-width:52px;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.days button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sum{display:flex;gap:8px;padding:4px 16px 10px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;font-size:14px;font-weight:700}
.row{display:flex;align-items:stretch;gap:10px;padding:0 16px;margin-bottom:8px}
.grid{position:relative;margin:14px 16px 8px}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.hl.half{border-top-style:dashed;opacity:.55}
.hl span{position:absolute;left:0;top:-10px;width:46px;background:var(--bg);font-weight:700;font-size:14px;color:var(--mute)}
.tap{position:absolute;left:52px;right:0;top:0;bottom:0;cursor:pointer}
.ev{position:absolute;left:52px;right:0;border:0;border-left:7px solid var(--c);border-radius:10px;background:var(--cbg);color:var(--ink);font:inherit;text-align:left;padding:4px 12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px}
.ev b{font-size:17px;line-height:1.2}.ev small{font-size:13px;color:var(--mute)}.ev span{font-size:13px;font-weight:700;color:var(--c)}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--bad);pointer-events:none}
.time{width:52px;padding-top:12px;color:var(--ink);font-weight:700;font-size:16px;line-height:1.15}.time small{display:block;color:var(--mute);font-weight:400;font-size:13px;margin-top:2px}.slot small,.slot.has b small{font-size:13px;font-weight:400;color:var(--mute)}
.slot{flex:1;min-height:56px;border-radius:12px;border:1.5px dashed var(--line);background:none;color:var(--mute);font:inherit;font-size:15px;text-align:left;padding:0 14px}
.slot.has{border:0;border-left:7px solid var(--c);background:var(--cbg);color:var(--ink);display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.slot.has b{font-size:18px}
.slot.has span{font-size:14px;font-weight:700;color:var(--c)}
.st-ok{--c:var(--ok);--cbg:var(--okbg)}.st-wait{--c:var(--wait);--cbg:var(--waitbg)}.st-bad{--c:var(--bad);--cbg:var(--badbg)}.st-done{--c:var(--done);--cbg:var(--donebg)}.st-new{--c:var(--new);--cbg:var(--newbg)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.sheet-bg.show{display:flex}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:21px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:10px;padding:15px;border-radius:12px;border:0;font:inherit;font-weight:700;background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--newbg);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.txt{background:none;color:var(--bad)}
.demo{margin-top:16px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.demo p{margin:0 0 4px;color:var(--mute);font-size:14px}
.stu{display:flex;justify-content:space-between;align-items:center;margin:0 16px 8px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stu small{display:block;color:var(--mute)}
.sw{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:99px;border:0}
.sw.on{background:var(--okbg);color:var(--ok)}.sw.off{background:var(--newbg);color:var(--mute)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:15px;z-index:20;display:none}
.toast.show{display:block}
.toast b{display:block;font-size:13px;opacity:.75}
.log{margin:0 16px}
.log div{padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
.log small{color:var(--mute);display:block}
.hint{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--newbg);color:var(--mute);font-size:14px}
.nav{display:flex;align-items:center;gap:8px;padding:4px 16px}.nav div{flex:1;text-align:center;font-weight:700}.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:22px;border-radius:10px;width:48px;height:44px}.nav .tdy{width:auto;padding:0 12px;font-size:15px;font-weight:700}.days button small{display:block;font-size:12px;font-weight:400;opacity:.85}
.tch{display:flex;gap:6px;padding:2px 16px 6px;overflow-x:auto}.tch button{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;white-space:nowrap}.tch button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}.stat{border-radius:14px;padding:14px;background:var(--cbg);border-left:7px solid var(--c)}.stat b{display:block;font-size:30px;line-height:1.1;color:var(--ink)}.stat span{font-size:14px;font-weight:700;color:var(--c)}
.money{margin:0 16px 12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.money div{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}.money b{font-size:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:center;font-weight:400;margin:16px 0 6px}.chk input{width:24px;height:24px;flex:none}
.tabs.hide{display:none}
.login{margin:16px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="ttl"></h1><div class="sub" id="sub"></div></header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<nav class="tabs hide">
  <button data-t="woche" class="on">Terminbuch</button>
  <button data-t="schueler">Schüler</button>
  <button data-t="bilanz">Bilanz</button>
  <button data-t="sms">SMS-Protokoll</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL="https://tcjioqamwsszgocdrtsq.supabase.co";
var SB_KEY="sb_publishable_L0FJtgJMqnyX3IxDROEw6A_UkVa8nbl";
var SCHOOL="Fahrschule Popel",TEACHER="Marcus";
var DAYS=["Mo","Di","Mi","Do","Fr","Sa"];
var LONG=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var START=480,END=1440,PPM=1.6;
var ST={neu:["Neu","st-new"],offen:["Warten auf Antwort","st-wait"],ok:["Kommt","st-ok"],abgesagt:["Abgesagt","st-bad"],nichterschienen:["Nicht erschienen","st-bad"],bestanden:["Prüfung bestanden","st-done"]};
function p2(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))}
function dm(d){return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."}
function dlabel(s){var d=parse(s);return LONG[(d.getDay()+6)%7]+", "+dm(d)}
function fmt(m){return p2(Math.floor(m/60)%24)+":"+p2(m%60)}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function startsIso(date,m){var p=date.split("-");return new Date(+p[0],+p[1]-1,+p[2],Math.floor(m/60),m%60).toISOString()}
var today=new Date(),weekStart=monday(today),sel=((today.getDay()+6)%7)<6?iso(today):iso(weekStart);
var students=[],appts=[],logs=[],prev={},tab="woche",sb=null;
var $=function(i){return document.getElementById(i)};
function sName(id){return students.filter(function(s){return s.id===id})[0]||{id:id,name:"Unbekannt",phone:"",sms:false}}
function toast(kind,msg){var t=$("toast");t.innerHTML="<b>"+esc(kind)+"</b>"+esc(msg);t.className="toast show";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},4500)}
function open(html){$("sheet").innerHTML=html;$("bg").className="sheet-bg show"}
function close(){$("bg").className="sheet-bg"}
$("bg").onclick=function(e){if(e.target===$("bg"))close()};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(function(x){x.className=x===b?"on":""});render()}});

/* ---------- Daten ---------- */
async function run(p){var r=await p;if(r.error){toast("Das hat nicht geklappt",r.error.message);return false}return true}
async function load(){
 var r1=await sb.from("students").select("*").order("name");
 var r2=await sb.from("appointments").select("*").order("starts_at");
 var r3=await sb.from("sms_log").select("*").order("created_at",{ascending:false}).limit(50);
 var err=r1.error||r2.error||r3.error;
 if(err){toast("Daten konnten nicht geladen werden",err.message);return false}
 students=r1.data.map(function(s){return {id:s.id,name:s.name,phone:s.phone,sms:!!s.sms_consent}});
 appts=r2.data.map(function(r){var d=new Date(r.starts_at);return {id:r.id,date:iso(d),m:d.getHours()*60+d.getMinutes(),len:r.duration_min,type:r.kind,label:r.label,sid:r.student_id,st:r.status,rem:!!r.reminder_sent_at}});
 logs=r3.data;return true}
async function sync(){await load();render()}

/* ---------- Anmeldung ---------- */
function loginView(){
 document.querySelector(".tabs").classList.add("hide");
 $("ttl").textContent="Terminbuch";$("sub").textContent=SCHOOL;
 $("main").innerHTML='<div class="login"><label for="em" style="margin-top:0">E-Mail</label><input id="em" type="email" autocomplete="username" inputmode="email"><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="go">Anmelden</button></div>';
 var go=async function(){
  var btn=$("go");btn.disabled=true;
  var r;
  try{r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value})}
  catch(e){r={error:{message:String(e&&e.message||e)}}}
  btn.disabled=false;
  if(r.error){
   var m=r.error.message||"";
   var why=/invalid login/i.test(m)?"E-Mail oder Passwort stimmt nicht. Achte auf Groß- und Kleinschreibung und Leerzeichen."
    :/not confirmed/i.test(m)?"Dieser Nutzer ist in Supabase noch nicht bestätigt (Authentication → Users → Nutzer öffnen → Confirm user)."
    :/fetch|network|load failed/i.test(m)?"Keine Verbindung zur Datenbank ("+m+"). Die Seite darf Supabase vermutlich nicht erreichen."
    :m;
   toast("Anmeldung fehlgeschlagen",why);return}
  enter()};
 $("go").onclick=go;
 $("pw").onkeydown=function(e){if(e.key==="Enter")go()};
}
async function enter(){document.querySelector(".tabs").classList.remove("hide");await load();render()}
async function logout(){await sb.auth.signOut();students=[];appts=[];logs=[];loginView()}

/* ---------- Ansichten ---------- */
function render(){if(tab==="woche")week();else if(tab==="schueler")list();else if(tab==="bilanz")bilanz();else logv()}
function clash(date,m,len,ignore){return appts.filter(function(a){return a.id!==ignore&&a.date===date&&m<a.m+a.len&&a.m<m+len})[0]}
function week(){
 $("ttl").textContent="Terminbuch";$("sub").textContent=SCHOOL+" · Fahrlehrer "+TEACHER;
 var days=[];for(var i=0;i<6;i++)days.push(addDays(weekStart,i));
 var h='<div class="nav"><button id="pv" aria-label="Vorige Woche">‹</button><div>'+dm(days[0])+' – '+dm(days[5])+'</div><button id="nx" aria-label="Nächste Woche">›</button><button id="td" class="tdy">Heute</button></div>';
 h+='<div class="days">'+days.map(function(d,i){return '<button class="'+(iso(d)===sel?"on":"")+'" data-d="'+iso(d)+'">'+DAYS[i]+'<small>'+d.getDate()+'.</small></button>'}).join("")+'</div>';
 var todays=appts.filter(function(a){return a.date===sel}).sort(function(a,b){return a.m-b.m});
 var cnt={ok:0,offen:0,abgesagt:0};
 todays.forEach(function(a){if(a.type==="fahrt"&&cnt[a.st]!==undefined)cnt[a.st]++});
 h+='<div class="sum"><span class="chip st-ok" style="background:var(--cbg);color:var(--c)">'+cnt.ok+' kommen</span><span class="chip st-wait" style="background:var(--cbg);color:var(--c)">'+cnt.offen+' offen</span><span class="chip st-bad" style="background:var(--cbg);color:var(--c)">'+cnt.abgesagt+' abgesagt</span></div>';
 h+='<div class="grid" id="grid" style="height:'+((END-START)*PPM)+'px"><div class="tap" id="tap"></div>';
 for(var t=START;t<=END;t+=30){h+='<div class="hl'+(t%60?' half':'')+'" style="top:'+((t-START)*PPM)+'px">'+(t%60?'':'<span>'+fmt(t)+'</span>')+'</div>'}
 todays.forEach(function(a){
  var top=(a.m-START)*PPM,ht=a.len*PPM-3;
  if(a.m<START||a.m>=END)return;
  if(a.type==="pause")h+='<button class="ev st-new" data-a="'+esc(a.id)+'" style="top:'+top+'px;height:'+ht+'px"><b>'+esc(a.label||"Pause")+'</b><small>'+fmt(a.m)+'–'+fmt(a.m+a.len)+'</small></button>';
  else{var s=ST[a.st]||ST.neu;h+='<button class="ev '+s[1]+'" data-a="'+esc(a.id)+'" style="top:'+top+'px;height:'+ht+'px"><b>'+esc(sName(a.sid).name)+'</b><small>'+fmt(a.m)+'–'+fmt(a.m+a.len)+(a.len>45?' ('+a.len+' Min)':'')+'</small><span>'+s[0]+'</span></button>'}});
 if(sel===iso(today)){var nm=today.getHours()*60+today.getMinutes();if(nm>=START&&nm<=END)h+='<div class="now" style="top:'+((nm-START)*PPM)+'px"></div>'}
 h+='</div>';
 $("main").innerHTML=h;
 $("tap").onclick=function(e){var r=$("tap").getBoundingClientRect();var m=START+Math.floor((e.clientY-r.top)/PPM/15)*15;if(m>END-15)m=END-15;newAppt(m)};
 $("pv").onclick=function(){weekStart=addDays(weekStart,-7);sel=iso(addDays(parse(sel),-7));render()};
 $("nx").onclick=function(){weekStart=addDays(weekStart,7);sel=iso(addDays(parse(sel),7));render()};
 $("td").onclick=function(){weekStart=monday(today);sel=((today.getDay()+6)%7)<6?iso(today):iso(weekStart);render()};
 $("main").querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){sel=b.dataset.d;render()}});
 $("main").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var a=appts.filter(function(x){return x.id===b.dataset.a})[0];if(!a)return;a.type==="pause"?pauseSheet(a):detail(a)}});
}
function timeOpts(sel0){var t="";for(var m=START;m<=END-15;m+=15)t+='<option value="'+m+'"'+(m===sel0?" selected":"")+'>'+fmt(m)+' Uhr</option>';return t}
function validPhone(p){return p.replace(/\D/g,"").length>=8}
function studentErr(err){return err.code==="23505"?"Diese Handynummer ist schon eingetragen.":err.message}
function newAppt(startM){
 var opts=students.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join("");
 open('<h2>Neuer Eintrag</h2><div class="sub">'+dlabel(sel)+'</div>'+
 '<label>Art</label><select id="ty"><option value="fahrt">Fahrstunde</option><option value="pause">Pause blocken</option></select>'+
 '<div id="fa"><label>Schüler</label><select id="sel">'+opts+'<option value="new">Neuer Schüler …</option></select>'+
 '<div id="nw" style="display:'+(students.length?'none':'block')+'"><label>Name</label><input id="nn" placeholder="Vor- und Nachname"><label>Handynummer</label><input id="np" inputmode="tel" placeholder="0170 …"><label class="chk"><input type="checkbox" id="nc"> Schüler hat der SMS zugestimmt</label></div></div>'+
 '<label>Beginn</label><select id="tm">'+timeOpts(startM)+'</select>'+
 '<label>Dauer</label><select id="ln"><option value="45" selected>45 Minuten (eine Fahrstunde)</option><option value="90">90 Minuten (Doppelstunde)</option><option value="135">135 Minuten (drei Stunden)</option><option value="30">30 Minuten</option><option value="60">60 Minuten</option></select>'+
 '<button class="btn" id="save">Speichern</button><button class="btn sec" id="cx">Abbrechen</button>');
 if(!students.length)$("sel").value="new";
 $("sel").onchange=function(){$("nw").style.display=$("sel").value==="new"?"block":"none"};
 $("ty").onchange=function(){var p=$("ty").value==="pause";$("fa").style.display=p?"none":"block";if(p)$("ln").value="60"};
 $("cx").onclick=close;
 $("save").onclick=async function(){
  var m=+$("tm").value,len=+$("ln").value,c=clash(sel,m,len,"");
  if(c){toast("Zeit belegt",(c.type==="pause"?c.label||"Pause":sName(c.sid).name)+" von "+fmt(c.m)+" bis "+fmt(c.m+c.len)+" Uhr.");return}
  var btn=$("save");btn.disabled=true;
  if($("ty").value==="pause"){
   if(await run(sb.from("appointments").insert({starts_at:startsIso(sel,m),duration_min:len,kind:"pause",label:"Pause"}))){close();await sync()}
   btn.disabled=false;return}
  var sid=$("sel").value;
  if(sid==="new"){
   var n=$("nn").value.trim(),ph=$("np").value.trim();
   if(!n){toast("Fehlt noch","Bitte einen Namen eingeben.");btn.disabled=false;return}
   if(!validPhone(ph)){toast("Fehlt noch","Bitte eine gültige Handynummer eingeben.");btn.disabled=false;return}
   var ok=$("nc").checked;
   var ins=await sb.from("students").insert({name:n,phone:ph,sms_consent:ok,consent_at:ok?new Date().toISOString():null}).select().single();
   if(ins.error){toast("Schüler nicht gespeichert",studentErr(ins.error));btn.disabled=false;return}
   sid=ins.data.id}
  if(await run(sb.from("appointments").insert({student_id:sid,starts_at:startsIso(sel,m),duration_min:len,kind:"fahrt",status:"neu"}))){close();await sync()}
  btn.disabled=false};
}
function sureDelete(btn,fn){btn.onclick=function(){if(!btn.dataset.sure){btn.dataset.sure="1";btn.textContent="Wirklich löschen? Nochmal tippen";return}fn()}}
function pauseSheet(a){
 open('<h2>'+esc(a.label||"Pause")+'</h2><div class="sub">'+dlabel(a.date)+', '+fmt(a.m)+'–'+fmt(a.m+a.len)+' Uhr</div>'+
 '<button class="btn txt" id="del">Pause löschen</button><button class="btn sec" id="cx">Schließen</button>');
 $("cx").onclick=close;
 sureDelete($("del"),async function(){if(await run(sb.from("appointments").delete().eq("id",a.id))){close();await sync()}});
}
async function setSt(a,st,msg){
 var before=a.st;
 if(await run(sb.from("appointments").update({status:st}).eq("id",a.id))){prev[a.id]=before;close();await sync();if(msg)toast(msg[0],msg[1])}}
function detail(a){
 var s=sName(a.sid),st=ST[a.st]||ST.neu,when=dlabel(a.date)+" um "+fmt(a.m)+" Uhr";
 open('<h2>'+esc(s.name)+'</h2><div class="sub">'+when+' · '+a.len+' Min · '+esc(s.phone)+'</div>'+
 '<div class="chip '+st[1]+'" style="background:var(--cbg);color:var(--c);display:inline-block;margin-top:10px">'+st[0]+'</div>'+
 (a.rem?'<div class="sub" style="margin-top:8px">Erinnerung per SMS wurde gesendet.</div>':'')+
 (!s.sms?'<div class="hint" style="margin:10px 0 0">Keine SMS an diesen Schüler: Er hat noch nicht zugestimmt.</div>':'')+
 (prev[a.id]?'<button class="btn sec" id="un">Letzte Änderung rückgängig</button>':'')+
 '<button class="btn sec" id="mv">Termin verschieben</button>'+
 '<button class="btn sec" id="okb">Kommt (telefonisch bestätigt)</button>'+
 '<button class="btn sec" id="abb">Abgesagt (telefonisch)</button>'+
 '<button class="btn bad" id="ne">Nicht erschienen</button>'+
 '<button class="btn ok" id="ps">Prüfung bestanden</button>'+
 '<button class="btn txt" id="del">Termin löschen</button><button class="btn sec" id="cx">Schließen</button>');
 $("cx").onclick=close;
 sureDelete($("del"),async function(){if(await run(sb.from("appointments").delete().eq("id",a.id))){close();await sync()}});
 if(prev[a.id])$("un").onclick=function(){var p=prev[a.id];delete prev[a.id];setSt(a,p)};
 $("okb").onclick=function(){setSt(a,"ok")};
 $("abb").onclick=function(){setSt(a,"abgesagt")};
 $("ne").onclick=function(){setSt(a,"nichterschienen")};
 $("ps").onclick=function(){setSt(a,"bestanden",s.sms?["Bewertungs-SMS","Geht in den nächsten Minuten automatisch raus."]:["Keine SMS","Der Schüler hat der SMS nicht zugestimmt."])};
 $("mv").onclick=function(){moveSheet(a,s)};
}
function moveSheet(a,s){
 open('<h2>Termin verschieben</h2><div class="sub">'+esc(s.name)+' · aktuell '+dlabel(a.date)+', '+fmt(a.m)+' Uhr</div>'+
 '<label>Neues Datum</label><input type="date" id="nd" value="'+a.date+'">'+
 '<label>Neuer Beginn</label><select id="nt">'+timeOpts(a.m)+'</select>'+
 '<button class="btn" id="ok">Verschieben</button><button class="btn sec" id="cx">Abbrechen</button>');
 $("cx").onclick=function(){detail(a)};
 $("ok").onclick=async function(){
  var d=$("nd").value,m=+$("nt").value;if(!d)return;
  var c=clash(d,m,a.len,a.id);
  if(c){toast("Zeit belegt","Dort ist schon etwas von "+fmt(c.m)+" bis "+fmt(c.m+c.len)+" Uhr eingetragen.");return}
  if(await run(sb.from("appointments").update({starts_at:startsIso(d,m),status:"neu",reminder_sent_at:null,nudge_sent_at:null,review_sent_at:null}).eq("id",a.id))){
   delete prev[a.id];sel=d;weekStart=monday(parse(d));close();await sync()}};
}
function studentSheet(s){
 open('<h2>'+(s?"Schüler bearbeiten":"Neuer Schüler")+'</h2>'+
 '<label>Name</label><input id="sn" value="'+(s?esc(s.name):"")+'" placeholder="Vor- und Nachname">'+
 '<label>Handynummer</label><input id="sp" inputmode="tel" value="'+(s?esc(s.phone):"")+'" placeholder="0170 …">'+
 '<label class="chk"><input type="checkbox" id="sc"'+(s&&s.sms?" checked":"")+'> Schüler hat der SMS zugestimmt</label>'+
 '<button class="btn" id="ss">Speichern</button><button class="btn sec" id="cx">Abbrechen</button>');
 $("cx").onclick=close;
 $("ss").onclick=async function(){
  var n=$("sn").value.trim(),ph=$("sp").value.trim(),ok=$("sc").checked;
  if(!n){toast("Fehlt noch","Bitte einen Namen eingeben.");return}
  if(!validPhone(ph)){toast("Fehlt noch","Bitte eine gültige Handynummer eingeben.");return}
  var row={name:n,phone:ph,sms_consent:ok};
  if(!s||s.sms!==ok)row.consent_at=ok?new Date().toISOString():null;
  var r=s?await sb.from("students").update(row).eq("id",s.id):await sb.from("students").insert(row);
  if(r.error){toast("Nicht gespeichert",studentErr(r.error));return}
  close();await sync()};
}
function list(){
 $("ttl").textContent="Schüler";$("sub").textContent=students.length+" Schüler";
 $("main").innerHTML='<div style="padding:0 16px 10px"><button class="btn" id="ns" style="margin-top:0">+ Neuer Schüler</button></div>'+
 '<div class="hint">„SMS erlaubt“ heißt: Der Schüler hat zugestimmt. Ohne Zustimmung wird keine SMS gesendet.</div>'+
 (students.length?students.map(function(s){return '<div class="stu"><div data-e="'+esc(s.id)+'" style="flex:1;cursor:pointer"><b>'+esc(s.name)+'</b><small>'+esc(s.phone)+'</small></div><button class="sw '+(s.sms?"on":"off")+'" data-s="'+esc(s.id)+'">'+(s.sms?"SMS erlaubt":"SMS aus")+'</button></div>'}).join(""):'<div class="hint">Noch keine Schüler. Tippe auf „Neuer Schüler“ oder trage beim ersten Termin einen ein.</div>')+
 '<div style="padding:8px 16px"><button class="btn sec" id="lo">Abmelden</button></div>';
 $("ns").onclick=function(){studentSheet(null)};
 $("lo").onclick=logout;
 $("main").querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){studentSheet(sName(b.dataset.e))}});
 $("main").querySelectorAll("[data-s]").forEach(function(b){b.onclick=async function(){
  var s=sName(b.dataset.s),on=!s.sms;
  if(await run(sb.from("students").update({sms_consent:on,consent_at:on?new Date().toISOString():null}).eq("id",s.id)))await sync()}});
}
function bilanz(){
 $("ttl").textContent="Bilanz";$("sub").textContent="Alle Fahrstunden im Terminbuch";
 var f=appts.filter(function(a){return a.type==="fahrt"});
 var n=function(st){return f.filter(function(a){return a.st===st}).length};
 $("main").innerHTML='<div class="stats">'+
 '<div class="stat st-ok"><b>'+n("ok")+'</b><span>kommen</span></div>'+
 '<div class="stat st-wait"><b>'+n("offen")+'</b><span>warten auf Antwort</span></div>'+
 '<div class="stat st-bad"><b>'+n("abgesagt")+'</b><span>rechtzeitig abgesagt</span></div>'+
 '<div class="stat st-bad"><b>'+n("nichterschienen")+'</b><span>nicht erschienen</span></div></div>'+
 '<div class="hint">Die Zahlen kommen aus den Einträgen in diesem Terminbuch. Je länger es benutzt wird, desto genauer zeigt es, wie viele Stunden ausfallen und wie viele rechtzeitig abgesagt werden.</div>';
}
function logv(){
 $("ttl").textContent="SMS-Protokoll";$("sub").textContent="Die letzten Nachrichten";
 $("main").innerHTML=logs.length?'<div class="log">'+logs.map(function(l){
  var t=new Date(l.created_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  return '<div><small>'+(l.direction==="in"?"Von ":"An ")+esc(l.phone)+' · '+t+'</small>'+esc(l.body)+'</div>'}).join("")+'</div>':'<div class="hint">Noch keine Nachrichten.</div>';
}

/* ---------- Start ---------- */
function fatal(msg){$("ttl").textContent="Terminbuch";$("sub").textContent="";$("main").innerHTML='<div class="hint">'+esc(msg)+'</div>'}
if(typeof supabase==="undefined"){fatal("Die Datenbank-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.")}
else{
 sb=supabase.createClient(SB_URL,SB_KEY);
 sb.auth.getSession().then(function(r){if(r.data&&r.data.session)enter();else loginView()}).catch(function(){loginView()});
 sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")loginView()});
 setInterval(function(){
  if(document.hidden||$("bg").classList.contains("show"))return;
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)load().then(function(ok){if(ok)render()})})},30000);
}
</script>
</body>
</html>
